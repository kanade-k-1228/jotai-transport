[package]
name = "jotai-transport"
version = "0.3.0"
edition = "2021"
description = "WebSocket server for synchronizing object state with jotai-transport (Rust)."
license = "Apache-2.0"
repository = "https://github.com/kanade-k-1228/jotai-transport"
readme = "README.md"
keywords = ["jotai", "websocket", "state", "sync"]
categories = ["web-programming::websocket", "network-programming"]

[features]
default = ["json"]
json = ["dep:serde_json"]
cbor = ["dep:ciborium"]
msgpack = ["dep:rmp-serde"]

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = "1"
serde_json = { version = "1", optional = true }
ciborium = { version = "0.2", optional = true }
rmp-serde = { version = "1.3", optional = true }

[package.metadata.docs.rs]
all-features = true
